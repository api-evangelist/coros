apis:
- name: COROS Partner API
  description: Programmatic access to COROS user data for established platforms, granted after an application to COROS (api@coros.com). Per the
    Partner API Access page it provides multi-user OAuth 2.0 credentials, webhook push of workout data (~5 minutes, with retries), two-way activity
    sync, structured workout and training plan sync, GPX route import/export (up to 50MB), daily health data, FIT file downloads and a 1,000 calls/minute
    rate limit. No public API reference or base URL is published; credentials and technical details are issued to approved partners.
  humanURL: https://support.coros.com/hc/en-us/articles/53181766856724-Partner-API-Access
  tags:
  - Partner API
  - Authentication
  - Webhook
  - Fitness
  tags_raw:
  - Partner API
  - OAuth 2.0
  - Webhooks
  - Fitness
  properties:
  - type: Documentation
    url: https://support.coros.com/hc/en-us/articles/53181766856724-Partner-API-Access
  - type: SignUp
    url: https://support.coros.com/hc/en-us/articles/17085887816340-Submit-an-API-Application
  aid: coros:coros-partner-api
- name: COROS MCP Server
  description: Remote Model Context Protocol server that lets applications read a user's COROS training data and write workout plans after the
    user authorizes them through OAuth 2.0 (single-user scope, no application required). Regional endpoints mcpus.coros.com, mcpeu.coros.com and
    mcpcn.coros.com are listed in the official coroslab/COROS-MCP repository.
  humanURL: https://support.coros.com/hc/en-us/articles/53181619102996-Build-on-COROS-MCP
  baseURL: https://mcp.coros.com/mcp
  tags:
  - MCP
  - Authentication
  - Artificial Intelligence
  tags_raw:
  - MCP
  - OAuth 2.0
  - AI
  properties:
