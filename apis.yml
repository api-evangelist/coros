aid: coros

name: COROS

description: COROS is a sports technology company that makes GPS sport watches (PACE, APEX, NOMAD, VERTIX), the DURA GPS bike computer, heart
  rate monitors and sensors, plus the COROS app and Training Hub for runners, cyclists, climbers and other endurance athletes. For developers,
  COROS publishes a Partner API for established platforms (multi-user OAuth 2.0, webhook push of workout data, two-way activity and workout/training-plan
  sync, GPX route import/export, daily health data and FIT file downloads, applied for via api@coros.com) and a COROS MCP server that apps can
  connect to through OAuth 2.0 without an application.

